<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Government Service</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                QueueLess
            </a>

            <a href="index.html" class="btn btn-light">
                Home
            </a>

        </div>

    </nav>


    <!-- Page Heading -->
    <section class="container text-center py-5">

        <h1 class="fw-bold">Select Your Government Service</h1>

        <p class="text-muted">
            Choose your office and the service you need.
        </p>

    </section>


    <!-- Service Selection Form -->
    <section class="container">

        <div class="form-card">

            <form id="serviceForm">

                <!-- Government Office -->
                <div class="mb-4">

                    <label for="office" class="form-label fw-bold">
                        1. Select Government Office
                    </label>

                   <select id="office" class="form-select" required>
    <option value="">-- Choose Office --</option>
    <option value="1">Municipal Corporation</option>
    <option value="2">Collector Office</option>
    <option value="3">Mamlatdar Office</option>
</select>

                </div>


                <!-- Government Service -->
                <div class="mb-4">

                    <label for="service" class="form-label fw-bold">
                        2. Select Required Service
                    </label>

                   <select id="service" class="form-select" required>
    <option value="">-- Choose Service --</option>
</select>

                </div>


                <!-- Continue Button -->
                <button type="submit" class="btn btn-primary w-100">
                    Continue →
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer class="text-center py-4 mt-5">

        <p class="mb-0">
            QueueLess Government Office | Hackathon Project
        </p>

    </footer>


    <!-- JavaScript -->
    <script>
document.addEventListener("DOMContentLoaded", function () {

    const office = document.getElementById("office");
    const service = document.getElementById("service");
    const form = document.getElementById("serviceForm");

    const services = {
        "1": [
            { id: "1", name: "Birth Certificate" }
        ],
        "2": [
            { id: "2", name: "Income Certificate" }
        ],
        "3": [
            { id: "3", name: "Caste Certificate" },
            { id: "4", name: "Residence Certificate" }
        ]
    };

    office.addEventListener("change", function () {

        service.innerHTML = '<option value="">-- Choose Service --</option>';

        const selectedServices = services[office.value] || [];

        selectedServices.forEach(function (item) {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.name;
            service.appendChild(option);
        });

    });

    form.addEventListener("submit", function (event) {

        event.preventDefault();

        if (!office.value || !service.value) {
            alert("Please select office and service.");
            return;
        }

        localStorage.setItem("selectedOffice", office.value);
        localStorage.setItem("selectedService", service.value);

        window.location.href = "citizen.html";

    });

});
</script>

</body>

</html>
